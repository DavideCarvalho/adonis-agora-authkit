  "dotenv": "17.4.2"
  "dotenv-cli": "11.0.0"
  "edge.js": "6.5.1"
  "elysia": "1.4.30"
  "eslint": "10.9.1"
  "hls-transcoder": "0.1.3"
  "hls.js": "1.7.1"
  "hot-hook": "1.0.0"
  "i18next": "26.4.0"
  "i18next-icu": "2.4.4"
  "ioredis": "6.0.0"
  "knex": "3.3.0"
  "luxon": "3.7.2"
  "mediabunny": "1.55.4"
  "nanoid": "6.0.1"
  "pg": "8.23.0"
  "pino-pretty": "13.1.3"
  "prettier": "3.9.6"
  "reflect-metadata": "0.2.2"
  "sharp": "0.35.4"
