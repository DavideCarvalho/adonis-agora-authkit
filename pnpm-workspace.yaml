packages:
  - "packages/*"
  - "apps/*"

# Disabled: with no explicit value pnpm applies a built-in supply-chain default
# (~24h), which blocks CI from installing a dependency the release workflow itself
# just published minutes ago (own-repo publishes, not third-party risk).
minimumReleaseAge: 0

allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  sharp: true

catalog:
  "@holoyan/adonisjs-activitylog": "1.0.0"
  "@eslint/js": "10.0.1"
  "@tuyau/client": "0.2.10"
  "@adocasts.com/dto": "0.0.10"
  "@adonisjs-community/modules": "2.0.0"
  "@aws-sdk/client-s3": "3.1121.0"
  "@aws-sdk/s3-request-presigner": "3.1121.0"
  "@ffmpeg-installer/ffmpeg": "1.1.0"
  "@ffprobe-installer/ffprobe": "2.1.2"
  "@japa/assert": "4.2.0"
  "@japa/plugin-adonisjs": "5.2.0"
  "@japa/runner": "5.3.0"
  "@jrmc/adonis-attachment": "5.2.1"
  "@poppinss/ts-exec": "1.4.4"
  "@videojs/http-streaming": "3.17.5"
  "@vinejs/vine": "4.4.0"
  "@vitejs/plugin-react": "6.1.1"
