  "videojs-contrib-quality-levels": "4.1.0"
  "vite": "8.2.2"
  "youch": "4.1.1"

catalogs:
  # Peer ranges. Kept separate from the pinned catalogs below on purpose:
  # pnpm inlines the catalog's literal value into peerDependencies at publish
  # time, so a pinned catalog ships pinned peers and every upstream patch
  # release breaks consumers. Dependencies want a pin (reproducible installs,
  # and the lockfile keeps them honest); peers want a range.
  # Only peerDependencies may point here.
  adonisPeers:
    "@adonisjs/ally": "^6.3.0"
    "@adonisjs/auth": "^10.1.0"
    "@adonisjs/core": "^7.5.0"
    "@adonisjs/drive": "^4.0.0"
    "@adonisjs/lock": "^2.1.0"
    "@adonisjs/lucid": "^22.4.2"
    "@adonisjs/redis": "^9.2.0 || ^10.0.0"
    "@adonisjs/session": "^8.1.0"
    "@adonisjs/shield": "^9.0.0"

  frontendPeers:
    "@inertiajs/react": "^3.7.0"
    "@simplewebauthn/browser": "^13.3.0"
    "@tanstack/react-query": "^5.102.8"
    "react": "^19.2.8"
    "react-dom": "^19.2.8"

  miscPeers:
    "@vinejs/vine": "^4.4.0"
    "edge.js": "^6.5.1"

  adonis:
    "@adonisjs/ally": "6.3.0"
    "@adonisjs/auth": "10.1.0"
    "@adonisjs/bouncer": "4.0.1"
    "@adonisjs/core": "7.5.0"
    "@adonisjs/cors": "3.0.0"
    "@adonisjs/drive": "4.0.0"
    "@adonisjs/i18n": "3.0.1"
