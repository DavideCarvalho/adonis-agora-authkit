# A changeset is the author declaring, in writing, that this PR changes what a
# user of the library sees. That is the moment the skills describing how to use
# it can go out of date, so this checks them here rather than after the release.
#
# `intent stale` cannot cover this case: it compares the skill's library_version
# against package.json, and the version only moves when `changeset version` runs
# during the release. check-skills.yml still handles that drift.

name: Skills follow the API

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.changeset/*.md'

jobs:
  update-skills:
    name: Update skills for this change
    # Pullfrog mints its App installation token over OIDC, and it reads these
    # at the job level -- a workflow-level block does not reach it.
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # A fork PR has no secrets and no push access to its head branch, so the
    # agent could neither run nor commit. The bot check keeps this job's own
    # commit from re-triggering it through `synchronize`, which would loop.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Collect the changesets this PR adds
        id: changesets
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "$BASE"
          files=$(git diff --name-only --diff-filter=AM "origin/$BASE...HEAD" -- '.changeset/*.md' \
                  | grep -v 'README' || true)
          if [ -z "$files" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "The pull request declares these user-visible changes:"
            echo
            for f in $files; do
              echo "--- $f"
              cat "$f"
              echo
            done
          } > "$RUNNER_TEMP/changesets.txt"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Build the prompt
        if: steps.changesets.outputs.found == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/changesets.txt"
            cat <<'PROMPT'

          Read every SKILL.md under packages/*/skills/ and correct only what the
          changesets above made inaccurate — a documented flag, exit code, output
          shape or command behaviour that no longer matches the code on this
          branch. Verify each correction against the source before writing it; a
          skill is read by other agents, so a confident wrong line is worse than
          a stale one.

          Do not rewrite a skill wholesale, do not add new skills, do not edit
          `library_version` (the release sets that), and do not touch files
          outside packages/*/skills/.

          If nothing in the skills contradicts these changesets, change nothing
          and say so. Otherwise commit the edits to this branch with a message
          saying which skill you corrected and why.
          PROMPT
          } > .skills-prompt.txt
          # fora do índice do git: o agente tem push, e este arquivo não é da branch
          echo '.skills-prompt.txt' >> .git/info/exclude

      - name: Update the skills
        if: steps.changesets.outputs.found == 'true'
        uses: pullfrog/pullfrog@v0.1.76
        with:
          prompt_file: .skills-prompt.txt
          model: opencode-go/muse-spark-1.3-contributor
          push: restricted
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
