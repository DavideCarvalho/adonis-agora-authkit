name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Build first (topological: core before server/client/react) so the
      # @adonis-agora/authkit-core .d.ts exist before dependents typecheck.
      - name: Build
        run: pnpm -r build

      # Packaging smoke: import every built module of each publishable package,
      # catching bugs like hard-imports that don't resolve at runtime.
      - name: Import smoke (packaging)
        run: node scripts/import-smoke.mjs

      # The WebAuthn bundle served by authkit-server is a committed artifact, so
      # bumping @simplewebauthn/browser in the lockfile does NOT regenerate it —
      # the package would declare one version and serve another, silently. This
      # rebuilds it and fails if the committed file drifted from the installed dep.
      - name: Check committed host CSS
        run: pnpm --filter @adonis-agora/authkit-server check:host-css

      - name: Check committed WebAuthn bundle
        run: pnpm --filter @adonis-agora/authkit-server check:webauthn-bundle

      - name: Typecheck
        run: pnpm -r typecheck

  # The suite runs on every Node line we support (the range `engines.node` promises): the lines
  # Node itself still maintains that AdonisJS 7 also accepts (it requires >=24). Lint, typecheck
  # and the packaging checks above stay on the single pinned version: only the test run is
  # multiplied.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Dependents import @adonis-agora/authkit-core (and friends) through their built output.
      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test
