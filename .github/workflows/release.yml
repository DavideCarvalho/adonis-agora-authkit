name: Release

# Manual trigger: run from the Actions tab (or `gh workflow run release.yml`).
# - With pending changesets, opens/updates a "version packages" PR.
# - With none, publishes any package whose version isn't on npm yet.
on:
  # Renovate's automerge of a patch/minor dependency bump lands here; the job below is
  # fenced so that a push by anyone else still releases nothing on its own.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Lets the job mint an OIDC token for npm trusted publishing, so a release needs no
  # long-lived NPM_TOKEN. changesets/action probes for this; without it the run logs
  # "No NPM_TOKEN or OIDC available" and never attempts OIDC at all.
  id-token: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still bundles npm 10.x.
      #
      # Pinned to 11.x, NOT @latest: npm 12 changed `npm info <pkg> --json` to return an
      # array of manifests where 11 returned a single packument object. Changesets reads
      # `pkgInfo.versions` off that value, which is `undefined` for an array, so on npm 12
      # EVERY package looks unpublished and it republishes already-live versions, which npm
      # rejects -- turning a fine release red. Revisit when changesets supports npm 12.
      - run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the step below would find nothing to publish and the new dependency would reach npm
      # only whenever someone next released by hand. This writes the changeset for it and
      # versions it in place, leaving the release a plain "nothing pending, publish" run.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.event_name == 'push' && github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          node .github/scripts/renovate-patch-release.mjs
          if [ -z "$(git status --porcelain .changeset)" ]; then exit 0; fi
          pnpm version-packages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: version packages"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately empty: setup-node writes .npmrc with _authToken=${NODE_AUTH_TOKEN},
          # and a real token there wins over OIDC -- npm uses the token and never exchanges
          # the id-token for a credential. Empty, npm sees no auth and falls back to trusted
          # publishing. The NPM_TOKEN secret still exists; put back `${{ secrets.NPM_TOKEN }}`
          # here to revert to the token if trusted publishing isn't configured on npmjs.com yet.
          NODE_AUTH_TOKEN: ''
