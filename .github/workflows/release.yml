name: Release

# Publishing lives in THIS FILE ONLY, and that is a constraint rather than a preference:
# npm trusted publishing binds each package to exactly one (repository, workflow file) pair,
# so a second workflow that ran `npm publish` could not authenticate. Same shape as
# adonis-agora-durable's release:
#
#   push to main        -> run the gate, version the pending changesets in place (a
#                          "chore: version packages" commit pushed to main) and publish
#                          them, in the same run
#   run manually        -> throwaway beta snapshot, changesets and git untouched
#
# No "version packages" PR to merge: merging a PR that carries a changeset IS the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two releases of the same ref concurrently (avoids a double-publish race), and queue
# rather than cancel: a run cut off mid-publish leaves a half-released state.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version and publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the "version packages" commit + git tags
      # `@changesets/changelog-github` resolves each changeset's PR and author through the API;
      # job-level permissions set every unlisted scope to none.
      pull-requests: read
      # Lets the job mint an OIDC token for npm trusted publishing, so a release needs no
      # long-lived NPM_TOKEN. changesets/action probes for this; without it the run logs
      # "No NPM_TOKEN or OIDC available" and never attempts OIDC at all.
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still bundles npm 10.x.
      #
      # Pinned to 11.x, NOT @latest: npm 12 changed `npm info <pkg> --json` to return an
      # array of manifests where 11 returned a single packument object. Changesets reads
      # `pkgInfo.versions` off that value, which is `undefined` for an array, so on npm 12
      # EVERY package looks unpublished and it republishes already-live versions, which npm
      # rejects -- turning a fine release red. Revisit when changesets supports npm 12.
      - run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A published version is effectively unrecallable, and every push to main with a pending
      # changeset publishes: verify the exact commit being released here rather than trusting the
      # PR's CI on an older base. These are ci.yml's checks on its pinned Node (the Node matrix
      # stays in ci.yml). Build runs here too, so a broken build fails before the version commit
      # is pushed rather than after.
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm -r build
      - name: Import smoke (packaging)
        run: node scripts/import-smoke.mjs
      - name: Check committed host CSS
        run: pnpm --filter @adonis-agora/authkit-server check:host-css
      - name: Check committed WebAuthn bundle
        run: pnpm --filter @adonis-agora/authkit-server check:webauthn-bundle
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Test
        run: pnpm -r test

      # A Renovate patch/minor bump automerges on its own and brings no changeset with it, so
      # the new dependency would reach npm only with the next hand-written changeset. This writes
      # a patch changeset for it, which the version step below then releases like any other.
      # Majors are merged by a person, so github.actor is not renovate[bot] and none of it runs.
      - name: Release a Renovate dependency bump
        if: github.actor == 'renovate[bot]'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          cat > "$RUNNER_TEMP/renovate-release.mjs" <<'NODE'
          // Writes a patch changeset for a Renovate dependency bump, and only for one: it stays quiet
          // unless a published package's dependencies or peerDependencies actually moved, so lockfile
          // maintenance, devDependency bumps and Actions bumps do not each cut a release.
          import { execFileSync } from "node:child_process";
          import { existsSync, readdirSync, writeFileSync } from "node:fs";
          import { createRequire } from "node:module";

          // Resolved from the checkout: this script runs from $RUNNER_TEMP.
          const { parse } = createRequire(process.cwd() + "/")("yaml");

          const before = process.env.BEFORE;
          const after = process.env.AFTER || "HEAD";
          const git = (...args) => execFileSync("git", args, { encoding: "utf8" });
          const skip = (why) => {
            console.log("No dependency release: " + why);
            process.exit(0);
          };

          // A changeset already waiting means a hand-written release is queued behind it. Versioning now
          // would drag that unreleased work out under a dependency bump's name.
          const pending = existsSync(".changeset")
            ? readdirSync(".changeset").filter((f) => f.endsWith(".md") && f.toLowerCase() !== "readme.md")
            : [];
          if (pending.length > 0) skip("changeset(s) already pending (" + pending.join(", ") + ")");
          if (!before || /^0+$/.test(before)) skip("no previous commit to compare against");

          const files = git("diff", "--name-only", before + ".." + after).split("\n").filter(Boolean);
          const isManifest = (f) => f === "package.json" || f.endsWith("/package.json");

          // Most versions here live in the pnpm-workspace.yaml catalogs, and pnpm inlines a catalog's
          // version into every published manifest that says `catalog:<name>`. A catalog bump moves no
          // package.json, yet it moves a runtime dependency all the same.
          const catalogsAt = (rev) => {
            let doc = {};
            try {
              doc = parse(git("show", rev + ":pnpm-workspace.yaml")) ?? {};
            } catch {}
            return { default: doc.catalog ?? {}, ...(doc.catalogs ?? {}) };
          };
          const movedEntries = new Set();
          if (files.includes("pnpm-workspace.yaml")) {
            const then = catalogsAt(before);
            for (const [name, entries] of Object.entries(catalogsAt(after))) {
              for (const [dep, version] of Object.entries(entries ?? {})) {
                if (then[name]?.[dep] !== version) movedEntries.add(name + " " + dep);
              }
            }
          }
          const catalogMoved = (deps) =>
            Object.entries(deps ?? {}).some(([dep, spec]) => {
              if (typeof spec !== "string" || !spec.startsWith("catalog:")) return false;
              return movedEntries.has((spec.slice("catalog:".length) || "default") + " " + dep);
            });

          // Every manifest a bump can reach: the ones the diff touched, plus — after a catalog bump —
          // all of them, since any may reference a moved entry.
          const changed =
            movedEntries.size > 0
              ? git("ls-files", "package.json", "**/package.json").split("\n").filter(Boolean)
              : files.filter(isManifest);
          if (changed.length === 0) skip("no package.json or catalog entry changed");

          const readAt = (rev, path) => {
            try {
              return JSON.parse(git("show", rev + ":" + path));
            } catch {
              return null;
            }
          };

          const bumped = [];
          for (const path of changed) {
            const now = readAt(after, path);
            if (!now || !now.name || now.private === true) continue;
            const then = readAt(before, path) || {};
            const moved = ["dependencies", "peerDependencies"].some(
              (field) =>
                JSON.stringify(now[field] || {}) !== JSON.stringify(then[field] || {}) ||
                catalogMoved(now[field]),
            );
            if (moved) bumped.push(now.name);
          }
          if (bumped.length === 0) skip("no published package changed a runtime dependency");

          const summary = git("log", "-1", "--pretty=%s", after).trim();
          writeFileSync(
            ".changeset/renovate-" + after.slice(0, 12) + ".md",
            ["---", ...bumped.map((name) => '"' + name + '": patch'), "---", "", summary, ""].join("\n"),
          );
          console.log("Patch release queued for " + bumped.join(", "));
          NODE
          node "$RUNNER_TEMP/renovate-release.mjs"

      # Pending changesets -> bump versions and changelogs and push them as a "chore: version
      # packages" commit to the branch (a GITHUB_TOKEN push starts no new run, so this cannot loop).
      #
      # Only what the gate tested is released. If the branch moved during this run, the only commits
      # tolerated on top of the tested one are this bot's own version commits (same code, only
      # versions and changelogs moved): fast-forward onto them so their changesets are not versioned
      # twice. Any other commit is untested here, so stop cleanly -- no version, no publish -- and let
      # the run queued for it (concurrency group) gate and release the combined tree.
      - name: Version packages
        id: version
        env:
          TESTED: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          # @changesets/changelog-github looks up each changeset's PR and author; throws without it.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          superseded() {
            echo "::notice::branch moved past the tested commit; the newer run will release"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$BRANCH"
          moved=$(git rev-list "$TESTED..origin/$BRANCH")
          for c in $moved; do
            [ "$(git log -1 --format='%an|%s' "$c")" = 'github-actions[bot]|chore: version packages' ] || superseded
          done
          git merge --ff-only "origin/$BRANCH"
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -iname 'readme.md' | wc -l)
          if [ "$pending" -eq 0 ]; then
            echo "No pending changesets: publishing whatever is not on npm yet."
            exit 0
          fi
          pnpm version-packages
          git add -A
          if git diff --cached --quiet; then
            echo "version-packages changed nothing (e.g. only private packages): nothing to commit."
            exit 0
          fi
          git commit -m "chore: version packages"
          git push origin "HEAD:$BRANCH" && exit 0
          # Rejected: the branch moved after the check above. Fail loudly only if it did not move.
          git fetch origin "$BRANCH"
          [ "$(git rev-parse "origin/$BRANCH")" != "$(git rev-parse HEAD~1)" ] && superseded
          echo "::error::Pushing the version commit failed and the branch has not moved."
          exit 1

      # No changesets are left by now, so the action takes its publish path: `pnpm release`
      # publishes every package whose version is not on npm yet, then tags git and creates the
      # GitHub releases.
      - name: Publish to npm
        if: steps.version.outputs.superseded != 'true'
        uses: changesets/action@v2.1.2
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deliberately empty: setup-node writes .npmrc with _authToken=${NODE_AUTH_TOKEN},
          # and a real token there wins over OIDC -- npm uses the token and never exchanges
          # the id-token for a credential. Empty, npm sees no auth and falls back to trusted
          # publishing.
          NODE_AUTH_TOKEN: ''

  snapshot:
    name: Publish beta snapshot to npm
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # changelog-github, as in the release job
      id-token: write # mints the OIDC credential npm exchanges for a publish token
    steps:
      # Cuts a THROWAWAY prerelease of every package with a pending changeset, published under the
      # `beta` dist-tag as `0.0.0-beta-<timestamp>`. It does NOT consume the changesets, bump source
      # versions, or tag git, so the eventual real release (the next push to main) is untouched
      # and still produces clean semver. Use it to try unreleased work: `pnpm add <pkg>@beta`.
      - uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.2
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 still bundles npm 10.x.
      #
      # Pinned to 11.x, NOT @latest: npm 12 changed `npm info <pkg> --json` to return an
      # array of manifests where 11 returned a single packument object. Changesets reads
      # `pkgInfo.versions` off that value, which is `undefined` for an array, so on npm 12
      # EVERY package looks unpublished and it republishes already-live versions, which npm
      # rejects -- turning a fine release red. Revisit when changesets supports npm 12.
      - run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp every pending-changeset package (and any out-of-range dependent) to
      # `0.0.0-beta-<datetime>` in the runner only, never committed.
      - name: Version as beta snapshot
        run: pnpm changeset version --snapshot beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # changelog-github, as in the release job

      - name: Build all packages
        run: pnpm build

      # `@latest` is untouched: these land under the `beta` dist-tag with no git tag.
      - name: Publish beta snapshot
        run: pnpm changeset publish --tag beta --no-git-tag
        env:
          # Empty on purpose, as in the release job: a real token here would win over OIDC.
          NODE_AUTH_TOKEN: ''
